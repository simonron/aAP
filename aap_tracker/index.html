<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aAP Diary</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}header,main{max-width:1100px;margin:auto;padding:16px}.card{background:white;border:1px solid #ccc;border-radius:10px;padding:14px;margin:12px 0}h1{margin:0 0 8px}label{font-weight:bold;display:block;margin:6px 0}input,select,textarea,button{font:inherit;padding:7px;border:1px solid #aaa;border-radius:6px}textarea{width:100%;box-sizing:border-box;resize:none;overflow:hidden}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #aaa;padding:5px;vertical-align:top}td input,td select,td textarea{width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer}.primary{background:#2457a6;color:white}.section{margin-top:18px}.saved{padding:8px;border-bottom:1px solid #ddd}@media(max-width:700px){.grid{grid-template-columns:1fr}.scroll{overflow:auto}table{min-width:850px}}@media print{.buttons,#savedBox{display:none}body{background:white}.card{border:0}}</style></head><body><header><h1>Adapted Autonomic Profile (aAP)</h1><div class="buttons"><button onclick="newDay()">New day</button><button onclick="save()">Save</button><button class="primary" onclick="pdf()">Create PDF</button><button onclick="emailPdf()">Email PDF</button></div></header><main><div class="card grid"><div><label>Patient Name</label><input id="patient" type="text"></div><div><label>Participant Initials</label><input id="initials" type="text"></div><div><label>Date</label><input id="date" type="date"></div></div><div id="form"></div><div class="card"><label>General notes</label><textarea id="notes"></textarea></div><div class="card" id="savedBox"><h2>Saved records</h2><div id="saved"></div></div></main><script>const K='aap-records-v2';const sections=[['EARLY MORNING (ON WAKING)',[['Lying','Lying'],['After 3 min sitting','Sitting'],['After 3 min standing','Standing']]],['BREAKFAST', [['Lying','Lying'],['After 3 min standing','Standing']]],['ACTIVITY / EXERTION — MORNING',[['Before exertion','Standing'],['After 3 min exertion','Standing']]],['LUNCH',[['Lying','Lying'],['After 3 min standing','Standing']]],['ACTIVITY / EXERTION — AFTERNOON',[['Before exertion','Standing'],['After 3 min exertion','Standing']]],['DINNER',[['Lying','Lying'],['After 3 min standing','Standing']]],['BEFORE SLEEPING (IN BED)',[['Lying in usual sleeping position','Lying']]],['ADDITIONAL ACTIVITY / SYMPTOM EVENT',[['Additional entry','Standing'],['Additional entry','Standing']]]];let id='';const $=x=>document.getElementById(x),now=()=>new Date().toTimeString().slice(0,5),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function grow(e){e.style.height='auto';e.style.height=e.scrollHeight+'px'}function render(){let h='';sections.forEach((s,si)=>{h+=`<div class="card section"><h2>${s[0]}</h2><div><label>Time / details of food, fluid or activity</label><textarea class="detail" data-s="${si}"></textarea></div><div class="scroll"><table><thead><tr><th>Enter time</th><th>Position/Activity</th><th>Blood Pressure</th><th>Heart Rate</th><th>Symptoms</th><th>Notes</th></tr></thead><tbody>`;s[1].forEach((r,ri)=>h+=`<tr data-s="${si}" data-r="${ri}"><td><input class="time" type="time"></td><td><input class="activity" value="${r[0]}"><select class="position"><option>Lying</option><option>Sitting</option><option ${r[1]=='Standing'?'selected':''}>Standing</option></select></td><td><input class="bp" placeholder="e.g. 120/80"></td><td><input class="hr" type="number" placeholder="e.g. 76"></td><td><textarea class="symptoms" placeholder="e.g. felt dizzy, headache, etc."></textarea></td><td><textarea class="rownotes"></textarea></td></tr>`);h+='</tbody></table></div></div>'});$('form').innerHTML=h;document.querySelectorAll('textarea').forEach(t=>t.oninput=()=>grow(t));}function records(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function collect(){return{id,date:$('date').value,patient:$('patient').value,initials:$('initials').value,notes:$('notes').value,updated:new Date().toISOString(),sections:sections.map((s,si)=>({title:s[0],detail:document.querySelector(`.detail[data-s="${si}"]`).value,rows:[...document.querySelectorAll(`tr[data-s="${si}"]`)].map(tr=>({time:tr.querySelector('.time').value,activity:tr.querySelector('.activity').value,position:tr.querySelector('.position').value,bp:tr.querySelector('.bp').value,hr:tr.querySelector('.hr').value,symptoms:tr.querySelector('.symptoms').value,notes:tr.querySelector('.rownotes').value}))}))}}function save(){let a=records(),r=collect(),i=a.findIndex(x=>x.id===id);if(i<0)a.push(r);else a[i]=r;localStorage.setItem(K,JSON.stringify(a));list()}function newDay(){id=crypto.randomUUID?crypto.randomUUID():Date.now()+'';$('patient').value='';$('initials').value='';$('date').value=today();$('notes').value='';render();document.querySelectorAll('.time').forEach(x=>x.value=now());save()}function load(x){let r=records().find(a=>a.id===x);if(!r)return;id=r.id;$('patient').value=r.patient||'';$('initials').value=r.initials||'';$('date').value=r.date||today();$('notes').value=r.notes||'';render();(r.sections||[]).forEach((s,si)=>{let d=document.querySelector(`.detail[data-s="${si}"]`);if(d)d.value=s.detail||'';(s.rows||[]).forEach((v,ri)=>{let tr=document.querySelector(`tr[data-s="${si}"][data-r="${ri}"]`);if(!tr)return;for(let k of ['time','activity','position','bp','hr','symptoms','notes']){let q=k==='notes'?'.rownotes':'.'+k,e=tr.querySelector(q);if(e)e.value=v[k]||''}})});document.querySelectorAll('textarea').forEach(grow);scrollTo(0,0)}function list(){let a=records().sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('saved').innerHTML=a.map(r=>`<div class="saved"><b>${esc(r.date)}</b> ${esc(r.patient)} <button onclick="load('${r.id}')">Reload / edit</button> <button onclick="load('${r.id}');setTimeout(pdf,50)">PDF</button></div>`).join('')||'No saved records yet.'}function pdf(){save();document.title=`aAP_${($('patient').value||'patient').replace(/\s+/g,'_')}_${$('date').value}`;window.print()}function emailPdf(){save();alert('Choose Create PDF / Save as PDF in the print window, then attach that single-day PDF to your email. On devices with a share sheet you can share the saved PDF directly to Mail.');pdf()}render();let a=records();if(a.length)load(a.sort((x,y)=>(y.updated||'').localeCompare(x.updated||''))[0].id);else newDay();</script></body></html>
